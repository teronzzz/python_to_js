<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Python → JavaScript Compiler</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>🐍 Python → ⚡ JavaScript</h1>

    <div class="editors">
        <div class="editor">
            <h2>Python</h2>
            <textarea id="pythonCode" placeholder="Введите Python код..."></textarea>
        </div>

        <div class="editor">
            <h2>JavaScript</h2>
            <textarea id="jsCode" placeholder="Результат..." readonly></textarea>
        </div>
    </div>

    <button onclick="transpile()">🚀 Скомпилировать</button>
</div>

<script src="script.js"></script>
</body>
</html>
