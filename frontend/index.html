<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Python → JavaScript Compiler</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>🐍 Python → ⚡ JavaScript</h1>

    <div class="editors">
        <div class="editor">
            <h2>Python</h2>
            <textarea id="pythonCode" placeholder="Введите Python код..."></textarea>
        </div>

        <div class="editor">
            <h2>JavaScript</h2>
            <textarea id="jsCode" placeholder="Результат..." readonly></textarea>
        </div>
    </div>

    <!-- Кнопка для ручной компиляции -->
    <button onclick="transpile()">Скомпилировать</button>

    <!-- Работа с файлами -->
    <div class="file-actions">
        <label class="file-label">
            <input type="file" id="fileInput" accept=".py" onchange="loadFileToEditor()">
            <span class="file-button">Выберите файл</span>
        </label>
        <span id="fileName" class="file-name">Файл не выбран</span>
        <button onclick="downloadJS()" class="action-button">Скачать .js</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
